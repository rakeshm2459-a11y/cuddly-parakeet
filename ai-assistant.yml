name: AI Assistant Issue Helper | AI ಸಹಾಯಕ Issue ಸಹಾಯಕ

on:
  issues:
    types: [opened, edited]

jobs:
  ai-assistant:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout code | ಕೋಡ್ ಪಡೆಯಿರಿ
        uses: actions/checkout@v3

      - name: Set up Python | Python ಸೆಟ್ ಮಾಡಿ
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies | ಅವಲಂಬನೆಗಳನ್ನು ಸ್ಥಾಪಿಸಿ
        run: |
          python -m pip install --upgrade pip
          pip install openai requests

      - name: AI Assistant Response | AI ಸಹಾಯಕ ಪ್ರತಿಕ್ರಿಯೆ
        id: ai_response
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python .github/scripts/ai_assistant.py

      - name: Post comment | ಪ್ರತಿಕ್ರಿಯೆ ಪೋಸ್ಟ್ ಮಾಡಿ
        if: steps.ai_response.outputs.comment_body
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${{ steps.ai_response.outputs.comment_body }}`
            })
